PACKAGE_NAME="wl-wpa3"
PACKAGE_VERSION="1.2"
AUTOINSTALL="yes"
# PRE_BUILD turns the pristine blob into the hooked one IN THE BUILD DIR every (re)build.
# This is the step the stock broadcom-sta/broadcom-wl dkms.conf lacks -- without it DKMS would
# compile the unpatched blob and produce a driver that scans but never completes WPA3-SAE.
PRE_BUILD="dkms-prebuild.sh"
MAKE[0]="make KVER=${kernelver}"
BUILT_MODULE_NAME[0]="wl"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# Only the amd64 blob is shipped and the patch offsets are amd64-only.
BUILD_EXCLUSIVE_ARCH="x86_64"
